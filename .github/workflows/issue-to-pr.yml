name: issue-to-pr

# When a maintainer adds the `approved` label to a form issue, turn it into a PR.
# The issue body is untrusted input. It is only ever passed through environment
# variables and files, never interpolated into a shell command.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: issue-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  to-pr:
    if: github.event.label.name == 'approved' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    env:
      # BOT_TOKEN (optional) lets the new PR trigger the validate workflow;
      # PRs opened with the default GITHUB_TOKEN do not start other workflows.
      GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.BOT_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Apply issue to data/
        id: apply
        run: |
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue.md"
          set +e
          python -m startup_jobs apply-issue \
            --body-file "$RUNNER_TEMP/issue.md" \
            --labels "$ISSUE_LABELS" \
            --summary-file "$RUNNER_TEMP/summary.txt" > "$RUNNER_TEMP/output.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/output.txt"
          echo "ok=$([ $status -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Report failure on the issue
        if: steps.apply.outputs.ok != 'true'
        run: |
          {
            echo "🤖 I couldn't turn this issue into a pull request:"
            echo
            cat "$RUNNER_TEMP/output.txt"
            echo
            echo "Please edit the issue to fix this. A maintainer can then remove and re-add the \`approved\` label."
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "$ISSUE_NUMBER" --remove-label approved || true
          exit 1

      - name: Open or update pull request
        run: |
          branch="issue-$ISSUE_NUMBER"
          summary="$(cat "$RUNNER_TEMP/summary.txt")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add data/
          if git diff --cached --quiet; then
            gh issue comment "$ISSUE_NUMBER" --body "🤖 This issue doesn't change anything in \`data/\`, so no pull request was opened."
            exit 0
          fi
          git commit -m "data: $summary (#$ISSUE_NUMBER)"
          git push --force origin "$branch"

          {
            echo "$summary"
            echo
            echo "Generated automatically from #$ISSUE_NUMBER after it was approved. The README is regenerated after merge."
            echo
            echo "Closes #$ISSUE_NUMBER"
          } > "$RUNNER_TEMP/pr-body.md"

          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/pr-body.md"
            url="$(gh pr view "$existing" --json url --jq .url)"
          else
            url="$(gh pr create --base "$BASE_BRANCH" --head "$branch" \
              --title "$summary" --body-file "$RUNNER_TEMP/pr-body.md")"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "🤖 Opened $url for review."
