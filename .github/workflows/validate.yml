name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Validate data files
        run: python -m startup_jobs validate
      - name: Run tests
        run: python -m pytest -q
      - name: Check the README renders
        run: python -m startup_jobs render --output "$RUNNER_TEMP/README.preview.md"
